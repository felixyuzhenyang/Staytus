name: Staytus checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - run: uv sync --frozen --extra dev
        working-directory: backend
      - run: uv run pytest -q
        working-directory: backend
      - run: uv run python ../scripts/export_openapi_3_0.py --check
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  postgres:
    runs-on: ubuntu-latest
    services:
      database:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: staytus_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d staytus_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      STAYTUS_TEST_DATABASE_URL: postgresql+psycopg://postgres:synthetic-ci-password@127.0.0.1:5432/staytus_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - run: uv sync --frozen --extra dev
        working-directory: backend
      - run: uv run pytest -q
        working-directory: backend
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/Dockerfile -t staytus-backend:check .
      - run: docker build -f frontend/Dockerfile -t staytus-frontend:check .
      - name: Check installed migrations and config without starting workers
        run: docker run --rm --network none --entrypoint python staytus-backend:check -m app.container_checks
