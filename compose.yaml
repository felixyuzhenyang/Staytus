services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: staytus
      POSTGRES_USER: staytus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting PostgreSQL}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - staytus_pgdata:/var/lib/postgresql/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/01-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U staytus -d staytus"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  staytus_pgdata:
