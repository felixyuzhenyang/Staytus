openapi: 3.0.3
info:
  title: Staytus authenticated agent tools
  version: 0.1.0
  description: >
    Read and proposal tools only. Replace server URL before import. Both service
    authentication and server-issued per-session context are mandatory. Context
    must be supplied by a trusted runtime binding, never generated by the LLM.
servers:
  - url: https://staytus-backend.example.com
    description: Replace with your deployed HTTPS backend; example is not live.
security:
  - ToolServiceKey: []
    StaytusSessionContext: []
paths:
  /tools/summarize_recent_official_messages:
    post:
      operationId: summarize_recent_official_messages
      summary: Summarize matching official-topic email content after explicit user content-analysis consent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [provider]
              properties:
                provider: {type: string, enum: [google, microsoft]}
                limit: {type: integer, minimum: 1, maximum: 5, default: 5}
      responses:
        '200': {$ref: '#/components/responses/Object'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {description: User has not enabled matching email-content analysis}
  /tools/read_recent_official_messages:
    post:
      operationId: read_recent_official_messages
      summary: Read recent official-topic mail previews after explicit user Agent permission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [provider]
              properties:
                provider: {type: string, enum: [google, microsoft]}
                limit: {type: integer, minimum: 1, maximum: 10, default: 5}
      responses:
        '200': {$ref: '#/components/responses/Object'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {description: User has not enabled Agent access to matching mailbox previews}
  /tools/get_student_profile:
    post:
      operationId: get_student_profile
      summary: Read the authenticated user's own profile
      requestBody: {$ref: '#/components/requestBodies/Empty'}
      responses:
        '200': {$ref: '#/components/responses/Object'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /tools/get_school_adapter:
    post:
      operationId: get_school_adapter
      summary: Read school-specific workflows and official reference links
      requestBody: {$ref: '#/components/requestBodies/Empty'}
      responses:
        '200': {$ref: '#/components/responses/Object'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /tools/search_official_policy:
    post:
      operationId: search_official_policy
      summary: Retrieve captured official sources with citations, review status, and freshness
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                query: {type: string, maxLength: 1000, default: ''}
                include_pending: {type: boolean, default: false}
      responses:
        '200': {$ref: '#/components/responses/Policies'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /tools/get_policy_version_and_status:
    post:
      operationId: get_policy_version_and_status
      summary: Read a policy version without inferring its legal effect
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [policy_version_id]
              properties:
                policy_version_id: {type: string}
      responses:
        '200': {$ref: '#/components/responses/Object'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /tools/calculate_deadline:
    post:
      operationId: calculate_deadline
      summary: Compute document dates and internal planning buffers deterministically
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                workflow:
                  type: string
                  enum: [program_extension, travel_review, document_review, opt_preparation, ead_review, academic_training_review]
                  default: program_extension
      responses:
        '200': {$ref: '#/components/responses/Deadlines'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /tools/list_action_tasks:
    post:
      operationId: list_action_tasks
      summary: Read personalized action tasks
      requestBody: {$ref: '#/components/requestBodies/Empty'}
      responses:
        '200': {$ref: '#/components/responses/Tasks'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /tools/get_policy_changes_for_profile:
    post:
      operationId: get_policy_changes_for_profile
      summary: Read reviewed changes relevant to the current profile
      requestBody: {$ref: '#/components/requestBodies/Empty'}
      responses:
        '200': {$ref: '#/components/responses/Changes'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /tools/escalate_to_isss:
    post:
      operationId: escalate_to_isss
      summary: Prepare an adviser handoff; does not send any data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: {type: string, maxLength: 1000, default: Review this question with an ISSS adviser}
      responses:
        '200': {$ref: '#/components/responses/Object'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /tools/build_action_plan:
    post:
      operationId: build_action_plan
      summary: Assemble tasks and dates without an external write
      requestBody: {$ref: '#/components/requestBodies/Empty'}
      responses:
        '200': {$ref: '#/components/responses/ActionPlan'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /tools/propose_profile_update:
    post:
      operationId: propose_profile_update
      summary: Propose profile edits for explicit user approval in Staytus
      requestBody: {$ref: '#/components/requestBodies/Preview'}
      responses:
        '200': {$ref: '#/components/responses/Approval'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /tools/create_email_preview:
    post:
      operationId: create_email_preview
      summary: Prepare an email preview; does not send or save an external draft
      requestBody: {$ref: '#/components/requestBodies/Preview'}
      responses:
        '200': {$ref: '#/components/responses/Approval'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /tools/create_calendar_preview:
    post:
      operationId: create_calendar_preview
      summary: Prepare an event preview; does not create an external event
      requestBody: {$ref: '#/components/requestBodies/Preview'}
      responses:
        '200': {$ref: '#/components/responses/Approval'}
        '401': {$ref: '#/components/responses/Unauthorized'}
components:
  securitySchemes:
    ToolServiceKey:
      type: apiKey
      in: header
      name: X-Tool-Key
      description: Backend service key held in a runtime connection, not a tool argument.
    StaytusSessionContext:
      type: apiKey
      in: header
      name: X-Staytus-Context
      description: >
        Short-lived server-signed context from an authenticated Staytus session.
        Requires trusted per-session propagation. Never use a shared static value
        for multiple students. If the tenant cannot propagate it, tools stay closed.
  requestBodies:
    Empty:
      required: true
      content:
        application/json:
          schema: {type: object, additionalProperties: false, properties: {}}
    Preview:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [payload]
            properties:
              payload:
                type: object
                additionalProperties: true
                description: >
                  Backend validates kind-specific fields. Profile dates use ISO dates;
                  calendar requires title/date; email requires subject/body.
  schemas:
    Resource: {type: object, additionalProperties: true}
    Approval:
      type: object
      additionalProperties: true
      properties:
        id: {type: string}
        kind: {type: string}
        status: {type: string}
        payload_hash: {type: string}
        payload: {type: object, additionalProperties: true}
        expires_at: {type: string}
  responses:
    Object:
      description: Authenticated backend result
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Resource'}
    Policies:
      description: Evidence with source URL, status, version and fixture label
      content:
        application/json:
          schema:
            type: object
            required: [policies]
            properties:
              policies: {type: array, items: {$ref: '#/components/schemas/Resource'}}
    Deadlines:
      description: Deterministic results with rule versions and calculation traces
      content:
        application/json:
          schema:
            type: object
            required: [deadlines]
            properties:
              deadlines: {type: array, items: {$ref: '#/components/schemas/Resource'}}
    Tasks:
      description: Tasks scoped to the authenticated profile
      content:
        application/json:
          schema:
            type: object
            required: [tasks]
            properties:
              tasks: {type: array, items: {$ref: '#/components/schemas/Resource'}}
    Changes:
      description: Relevant changes, including pending-review labels
      content:
        application/json:
          schema:
            type: object
            required: [changes]
            properties:
              changes: {type: array, items: {$ref: '#/components/schemas/Resource'}}
    ActionPlan:
      description: Deterministic plan; no external action performed
      content:
        application/json:
          schema:
            type: object
            required: [tasks, deadlines]
            properties:
              tasks: {type: array, items: {$ref: '#/components/schemas/Resource'}}
              deadlines: {type: array, items: {$ref: '#/components/schemas/Resource'}}
    Approval:
      description: Proposal requiring user preview and approval through Staytus UI
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Approval'}
    Unauthorized:
      description: Missing, invalid, or expired service credential or user context
      content:
        application/json:
          schema:
            type: object
            properties:
              detail: {type: string}
